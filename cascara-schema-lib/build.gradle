plugins {
    id "java-library"
    id "io.github.qishr.cascara.conventions" version "0.1.0"
    id "io.github.qishr.cascara.publish" version "0.1.1"
}


repositories {
	mavenLocal()
	mavenCentral()
}


tasks.withType(JavaCompile).configureEach {
    options.release = 21
}


dependencies {
    implementation(platform("io.github.qishr:cascara-meta-bom:$cascara_version"))

    // JUnit
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testImplementation 'org.junit.jupiter:junit-jupiter-params'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation('io.github.qishr:cascara-test-common-junit')

    // Mockito
    testImplementation 'org.mockito:mockito-core'
    testImplementation 'org.mockito:mockito-junit-jupiter'


    // Cascara
    implementation "io.github.qishr:cascara-common"
    implementation "io.github.qishr:cascara-common-io"
    implementation "io.github.qishr:cascara-lang-json"
}


tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:-missing', '-quiet')
}


tasks.named('test', Test) {
    description = 'Runs tests in a JPMS modular environment.'

    modularity.inferModulePath = true

    useJUnitPlatform {
        excludeTags 'requires-jar'
    }

    // Capture source set output paths lazily during configuration time
    def mainClassesDir = sourceSets.main.output.classesDirs.asPath
    def testClassesDir = sourceSets.test.output.classesDirs.asPath
    def testResourcesDir = sourceSets.test.output.resourcesDir.absolutePath
    def testOutputs = "${testClassesDir}${File.pathSeparator}${testResourcesDir}"
    def runtimeClasspath = configurations.testRuntimeClasspath.asPath

    doFirst {
        def mainModuleName = 'cascara.schema'

        jvmArgs([
            '--module-path', "${mainClassesDir}${File.pathSeparator}${runtimeClasspath}",
            '--add-modules', mainModuleName,
            '--patch-module', "${mainModuleName}=${testOutputs}",
            '--add-reads', "${mainModuleName}=ALL-UNNAMED",
            '--add-modules', 'org.junit.platform.launcher',
            '--add-reads', "${mainModuleName}=org.junit.jupiter.api",
            '--add-opens', 'java.base/java.lang=ALL-UNNAMED',
            '--add-opens', "java.base/java.lang=${mainModuleName}",
            // '-Dcascara.lang.locale=fr-FR',
            // '-Dcascara.lang.localize-exceptions=true'
        ])
    }
}


